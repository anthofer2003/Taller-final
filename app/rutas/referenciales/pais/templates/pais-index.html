{% extends 'base.html' %}

{% block titulo %}
Paises
{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Listar Paises</h3>

    <!-- Tarjeta -->
    <div class="card">
        <div class="card-header">
            <button type="button" class="btn btn-primary" id="btnAgregar">Agregar</button>
        </div>
        <div class="card-body">
            <table class="table table-striped" id="tbl">
                <thead>
                    <tr>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Formulario -->
    <div class="modal" id="modalFormulario" tabindex="-1" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title" id="modalTitle"></h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <div class="form-group">
                        <input type="hidden" id="txtIdPais">
                        <label for="txtDescripcion">Descripción:</label>
                        <input type="text" class="form-control" placeholder="Ingrese un país" id="txtDescripcion" maxlength="100" autocomplete="off">
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Alerta de éxito -->
    <div class="row mt-4 d-none" id="rowAlerta">
        <div class="col col-md-12">
            <div class="alert alert-success" role="alert">
                <strong>Registro Exitoso!</strong>
                <div class="row" id="mostrarAlerta"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
  const regexDescripcion = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: {
        url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
      },
      ajax:'/api/v1/paises',
      columns: [
        { data: 'descripcion' },
        { data: function(row) {
            return `<button type="button" name="btn_editar" class="btn btn-primary btn-sm" data-id="${row.id}">Editar</button>
                    <button type="button" name="btn_eliminar" class="btn btn-danger btn-sm" data-id="${row.id}">Eliminar</button>`
          }
        }
      ],
      destroy: true // Para poder recargar la tabla varias veces sin problemas
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function(){
      $('#modalTitle').text("Agregar un País");
      $('#txtIdPais').val("");
      $('#txtDescripcion').val("");
      $('#modalFormulario').modal('show');
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function() {
      const idPais = $('#txtIdPais').val();
      const nuevaDescripcion = $('#txtDescripcion').val().trim();
      const tabla = $('#tbl').DataTable();

      if (!nuevaDescripcion) {
        Swal.fire("Error", "La descripción no puede estar vacía.", "warning");
        return;
      }

      if (!regexDescripcion.test(nuevaDescripcion)) {
        Swal.fire("Error", "La descripción solo puede contener letras y espacios.", "warning");
        return;
      }

      const url = idPais ? `/api/v1/paises/${idPais}` : '/api/v1/paises';
      const method = idPais ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ descripcion: nuevaDescripcion })
      })
      .then(resp => resp.json())
      .then(data => {
        if (data && data.success) {
          tabla.ajax.reload(null, false); // refrescar sin resetear paginación
          Swal.fire(idPais ? "Actualizado" : "Agregado", data.message || "Operación exitosa.", "success");
          $('#modalFormulario').modal("hide");
          $('#txtDescripcion').val("");
        } else {
          Swal.fire("Error", data.error || "Ocurrió un error al procesar la solicitud.", "error");
        }
      })
      .catch(err => {
        console.error(err);
        Swal.fire("Error", "Error en la comunicación con el servidor.", "error");
      });
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]', function(){
      Swal.fire({
        title: "¿Deseas editar este registro?",
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          $('#modalTitle').text("Editar un País");
          const idPais = $(this).data('id');
          $('#txtIdPais').val(idPais);

          fetch(`/api/v1/paises/${idPais}`)
            .then(resp => resp.json())
            .then(data => {
              if (data.success) {
                $('#txtDescripcion').val(data.data.descripcion);
                $('#modalFormulario').modal('show');
              } else {
                Swal.fire("Error", data.error, "error");
              }
            })
            .catch(() => {
              Swal.fire("Error", "Error en la comunicación con el servidor.", "error");
            });
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]', function(){
      const idPais = $(this).data('id');
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/paises/${idPais}`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json'
            }
          })
          .then(resp => resp.json())
          .then(data => {
            if (data && data.success) {
              const tabla = $('#tbl').DataTable();
              tabla.ajax.reload(null, false);
              Swal.fire("Eliminado", "El país fue eliminado correctamente.", "success");
            } else {
              Swal.fire("Error", data.error || "No se pudo eliminar el país.", "error");
            }
          })
          .catch(() => {
            Swal.fire("Error", "Error en la comunicación con el servidor.", "error");
          });
        }
      });
    });
  }

  const addEvents = () => {
    agregar();
    guardar();
    editar();
    eliminar();
  }

  $(function() {
    initDatatable();
    addEvents();
  });
</script>
{% endblock %}
