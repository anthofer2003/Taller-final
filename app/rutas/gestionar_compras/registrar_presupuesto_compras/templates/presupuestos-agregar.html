{% extends 'base.html' %}

{% block titulo %}
Formulario Presupuesto del Proveedor
{% endblock %}

{% block contenido %}
<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3>Formulario Presupuesto del Proveedor</h3>
    </div>

    <div class="card-body">
      <div class="row">
        <!-- Columna izquierda -->
        <div class="col-md-6">
          <div class="form-group">
            <label for="txt_nro_presupuesto">Nro. Presupuesto:</label>
            <input type="text" class="form-control" id="txt_nro_presupuesto" placeholder="Automático o manual">
          </div>

          <div class="form-group">
            <label for="txt_fecha">Fecha:</label>
            <input type="date" class="form-control" id="txt_fecha">
          </div>

          <div class="form-group">
            <label for="cbo_proveedor">Proveedor:</label>
            <select id="cbo_proveedor" class="custom-select">
              <option value="">Seleccione un proveedor</option>
              {% for item in proveedores %}
                <option value="{{ item['id_proveedor'] }}">{{ item['nombre_proveedor'] }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="txt_empresa">Empresa:</label>
            <input type="text" class="form-control" id="txt_empresa" placeholder="Empresa">
          </div>
        </div>

        <!-- Columna derecha -->
        <div class="col-md-6">
          <div class="form-group">
            <label for="cbo_deposito">Depósito:</label>
            <select id="cbo_deposito" class="custom-select">
              <option value="">Seleccione un depósito</option>
              {% for item in depositos %}
                <option value="{{ item['id_deposito'] }}">{{ item['nombre_deposito'] }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="txt_funcionario">Funcionario:</label>
            <input type="text" class="form-control" id="txt_funcionario" placeholder="Funcionario responsable">
          </div>

          <div class="form-group">
            <label for="cbo_sucursal">Sucursal:</label>
            <select id="cbo_sucursal" class="custom-select">
              <option value="">Seleccione una sucursal</option>
              {% for item in sucursales %}
                <option value="{{ item['id'] }}">{{ item['descripcion'] }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="txt_stock">Cantidad en Stock:</label>
            <input type="number" class="form-control" id="txt_stock" placeholder="Cantidad actual en stock">
          </div>
        </div>
      </div>

      <hr>

      <!-- Sección de productos -->
      <div class="form-group row mt-3">
        <label for="cbo_item" class="col-md-2 col-form-label">Items:</label>
        <div class="col-md-4">
          <select id="cbo_item" class="custom-select">
            <option value="">Seleccione un item</option>
            {% for item in items %}
              <option value="{{ item['id_item'] }}">{{ item['descripcion'] }}</option>
            {% endfor %}
          </select>
        </div>
        <label for="txt_cantidad" class="col-md-2 col-form-label">Cantidad:</label>
        <div class="col-md-2">
          <input type="number" class="form-control" id="txt_cantidad" min="1" placeholder="0">
        </div>
        <div class="col-md-2">
          <button type="button" class="btn btn-success w-100" id="btn_agregar_item">Agregar</button>
        </div>
      </div>

      <hr>

      <!-- Tabla de productos -->
      <div class="row mt-3">
        <div class="col-md-12">
          <table class="table table-hover" id="tbl_items">
            <thead class="thead-light">
              <tr>
                <th>Código</th>
                <th>Item</th>
                <th>Cantidad</th>
                <th>Proveedor</th>
                <th>Precio IVA incluido</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card-footer text-center">
      <button type="button" class="btn btn-primary" id="btn_guardar_presupuesto">Grabar</button>
      <button type="button" class="btn btn-info" id="btn_consultar_presupuesto">Consultar</button>
      <button type="button" class="btn btn-warning" id="btn_cancelar_presupuesto">Cancelar</button>
      <button type="button" class="btn btn-secondary" id="btn_salir_presupuesto">Salir</button>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
  let items_agregados = [];
  const data_from_server = {
    items: {{ items|tojson }}
  };

  function crearFila(item) {
    return `
      <tr data-id="${item.id_item}">
        <td>${item.id_item}</td>
        <td>${item.descripcion}</td>
        <td>${item.cantidad}</td>
        <td>${$('#cbo_proveedor option:selected').text()}</td>
        <td>${item.precio || 0}</td>
        <td>
          <button type="button" class="btn btn-sm btn-warning modificar">Modificar</button>
          <button type="button" class="btn btn-sm btn-danger eliminar">Borrar</button>
        </td>
      </tr>
    `;
  }

  function obtenerDetallePresupuesto() {
    const detalle = [];
    $('#tbl_items tbody tr').each(function() {
      detalle.push({
        id_item: Number($(this).children().eq(0).text()),
        descripcion: $(this).children().eq(1).text(),
        cantidad: Number($(this).children().eq(2).text()),
        proveedor: $(this).children().eq(3).text(),
        precio_iva: Number($(this).children().eq(4).text())
      });
    });
    return detalle;
  }

  function addEvents() {
    // AGREGAR ITEM
    $('#btn_agregar_item').on('click', function() {
      const id_item = Number($('#cbo_item').val());
      const cantidad = Number($('#txt_cantidad').val());
      const proveedor = $('#cbo_proveedor').val();

      if(!id_item) return Swal.fire("Error", "Debe seleccionar un item", "error");
      if(!cantidad) return Swal.fire("Error", "Debe ingresar una cantidad", "error");
      if(!proveedor) return Swal.fire("Error", "Debe seleccionar un proveedor", "error");

      const { items } = data_from_server;
      const item_sel = items.find(it => it.id_item === id_item);

      if(items_agregados.includes(id_item))
        return Swal.fire("Atención", "El item ya fue agregado", "warning");

      item_sel.cantidad = cantidad;
      items_agregados.push(id_item);

      $('#tbl_items tbody').append(crearFila(item_sel));
      $('#cbo_item').val('');
      $('#txt_cantidad').val('');
    });

    // ELIMINAR ITEM
    $('#tbl_items tbody').on('click', '.eliminar', function() {
      const id = Number($(this).closest('tr').data('id'));
      items_agregados = items_agregados.filter(x => x !== id);
      $(this).closest('tr').remove();
      Swal.fire("Eliminado", "El item fue eliminado correctamente", "info");
    });

    // MODIFICAR ITEM
    $('#tbl_items tbody').on('click', '.modificar', function() {
      const row = $(this).closest('tr');
      const descripcion = row.children().eq(1).text();
      const cantidad_actual = row.children().eq(2).text();

      Swal.fire({
        title: `Modificar cantidad de ${descripcion}`,
        input: 'number',
        inputLabel: 'Nueva cantidad',
        inputValue: cantidad_actual,
        showCancelButton: true,
        confirmButtonText: 'Guardar cambios',
        cancelButtonText: 'Cancelar',
        preConfirm: (value) => {
          if (!value || value <= 0) {
            Swal.showValidationMessage("Ingrese una cantidad válida");
          }
          return value;
        }
      }).then(result => {
        if (result.isConfirmed) {
          row.children().eq(2).text(result.value);
          Swal.fire("Modificado", "Cantidad actualizada correctamente", "success");
        }
      });
    });

    // CONSULTAR PRESUPUESTO
    $('#btn_consultar_presupuesto').on('click', function() {
      const detalle = obtenerDetallePresupuesto();
      if(detalle.length === 0)
        return Swal.fire("Atención", "No hay items cargados", "warning");

      let html = "<ul class='text-left'>";
      detalle.forEach(d => {
        html += `<li><b>${d.descripcion}</b> - Cantidad: ${d.cantidad}, Proveedor: ${d.proveedor}, Precio: ${d.precio_iva}</li>`;
      });
      html += "</ul>";

      Swal.fire({
        title: "Detalle del Presupuesto",
        html,
        width: '600px'
      });
    });

    // GUARDAR PRESUPUESTO
    $('#btn_guardar_presupuesto').on('click', function() {
      const payload = {
        nro_presupuesto: $('#txt_nro_presupuesto').val(),
        fecha: $('#txt_fecha').val(),
        id_proveedor: Number($('#cbo_proveedor').val()),
        id_sucursal: Number($('#cbo_sucursal').val()),
        id_deposito: Number($('#cbo_deposito').val()),
        funcionario: $('#txt_funcionario').val(),
        empresa: $('#txt_empresa').val(),
        detalle_presupuesto: obtenerDetallePresupuesto()
      };

      fetch(`/api/v1/gestionar-compras/registrar-presupuesto-compras/presupuestos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(resp => resp.json())
      .then(data => {
        if(data && data.success) {
          Swal.fire("Éxito", "Presupuesto registrado correctamente", "success");
        } else {
          Swal.fire("Error", data.error || "Ocurrió un problema", "error");
        }
      })
      .catch(err => {
        console.error(err);
        Swal.fire("Error", "Error al registrar el presupuesto", "error");
      });
    });

    // CANCELAR
    $('#btn_cancelar_presupuesto').on('click', function() {
      $('#tbl_items tbody').empty();
      items_agregados = [];
      Swal.fire("Cancelado", "Operación cancelada", "info");
    });

    // SALIR
    $('#btn_salir_presupuesto').on('click', function() {
      location.replace("{{ url_for('pdpmod.presupuestos_index') }}");
    });
  }

  $(function() {
    addEvents();
  });
</script>
{% endblock %}
