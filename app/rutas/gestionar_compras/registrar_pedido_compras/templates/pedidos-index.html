{% extends 'base.html' %}
    
{% block titulo %}
Listar Pedido de Compras
{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Listar Pedido de Compras</h3>

    <!-- tarjeta -->
    <div class="card">
      <div class="card-header">
        <a href="{{ url_for('pdcmod.pedidos_agregar') }}" target="_blank" class="btn btn-primary">Agregar</a>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>Código</th>
              <th>Solicitante</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
      </table>
      </div>
    </div>
    <!-- /tarjeta -->

    <div class="row mt-4 d-none" id="rowAlerta">
        <div class="col col-md-12">
            <div class="alert alert-success">
                <strong>Registro Exitoso!</strong>
                <div class="row" id="mostrarAlerta"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: {
        url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
      },
      ajax:'/api/v1/gestionar-compras/registrar-pedido-compras/pedidos',
      columns: [
        { data: 'id_pedido_compra' },
        { data: 'empleado' },
        { data: 'estado' },
        { data: function(row) {
            return `<button type="button" name="btn_eliminar" class="btn btn-danger" data-id="${row.id_pedido_compra}">Anular</button>`
          }
        }
      ]
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function(){
      // Agregar nuevo registro si es necesario
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]', function() {
      const idPedido = $(this).data('id');
      
      // Mostrar mensaje de confirmación
      Swal.fire({
        title: "¿Deseas modificar este pedido?",
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          // Redirigir a la página de edición (puedes cambiar la URL según sea necesario)
          window.location.href = `/editar-pedido/${idPedido}`;
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]', function() {
      const idPedido = $(this).data('id');
      
      // Mostrar mensaje de confirmación para la eliminación
      Swal.fire({
        title: "¿Deseas anular este pedido?",
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          // Realizar la petición para anular (DELETE)
          fetch(`/api/v1/gestionar-compras/registrar-pedido-compras/pedidos/${idPedido}`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json'
            }
          })
          .then(resp => resp.json())
          .then(data => {
            if(data && !data.error && data.success) {
              // Eliminar la fila del DataTable
              const fila = $(this).closest('tr');
              const tabla = $('#tbl').DataTable();
              tabla.row(fila).remove().draw();
              Swal.fire("Anulado", "El pedido de compra ha sido anulado correctamente.", "success");
            } else {
              Swal.fire(data.error || "Error al anular el pedido.");
            }
          }).catch(err => {
            console.error(err);
            Swal.fire("Error", "Ocurrió un error al anular el pedido.", "error");
          });
        }
      });
    });
  }

  const addEvents = () => {
    agregar();
    editar();
    eliminar();
  }

  $(function() {
    initDatatable();
    addEvents();
  });
</script>
{% endblock %}
